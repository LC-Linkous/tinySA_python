[project]
name = "tsapython"
version = "2.0.0"
description = "An UNOFFICIAL Python API for the tinySA series of devices"
readme = "README.md"
authors = [
    { name = "LC_Linkous", email = "L.C.Linkous@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.5",
    "numpy>=2.2.6",
    "pandas>=2.3.1",
    "pyserial>=3.5",
]


[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"
