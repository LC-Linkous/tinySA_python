[project]
name = "tsapython"
version = "3.0.0"
authors = [
    { name = "LC-Linkous", email = "L.C.Linkous@gmail.com" }
]
description = "An UNOFFICIAL Python API for the tinySA series of devices"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.2.6",
    "pyserial>=3.5",
]
license = "GPL-2.0-only"
license-files = ["LICENSE*"]

[project.optional-dependencies]
plotting = [
    "matplotlib>=3.10.5",
    'pyqt5 ; platform_system == "Linux"',
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
"Repository" = "https://github.com/LC-Linkous/tinySA_python"
"Issues" = "https://github.com/LC-Linkous/tinySA_python/issues"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "hardware: tests that require a physically connected tinySA device (deselect with -m 'not hardware')",
]
# PEP 735 dependency group used by `uv sync` and CI. The [project.optional-dependencies]
# test extra above is kept for `pip install -e ".[test]"` compatibility.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberately small blocking ruleset: F (pyflakes: real bugs -- unused imports,
# undefined names) plus E9 (syntax errors). Style rules (E/W whitespace,
# line length, None-comparisons) are a planned follow-up cleanup pass; enabling
# them now would gate CI on ~680 pre-existing cosmetic findings.
select = ["E9", "F"]
