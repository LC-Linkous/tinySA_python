name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: this is deliberately a **non-GUI** API. GUI features are
        out of scope. New device commands are in scope — note that the
        `command()` function already provides raw access to any serial command,
        so a request for a wrapped method is a request for validation, parsing,
        documentation and a device-profile gate around it (see "Adding a
        command" in CONTRIBUTING.md).

        If a **firmware update** added, removed or changed a command, say which
        firmware build (`version()`), and attach the output of
        `uv run python tests/probe_firmware_returns.py` if you can run it: it
        records what your device's firmware accepts, command by command.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that the library doesn't currently support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the method / behavior look like? A sketch of the signature is helpful.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Acquisition (scan / sweep / data)
        - Markers / traces
        - Levels / gain
        - Output / signal generator
        - Calibration
        - Display / UI commands
        - Presets / config
        - System info / connection / autodetect
        - Firmware compatibility (a firmware build added, removed or changed a command)
        - Device profiles (a new board, or a wrong range / word list for one)
        - Logging / error reporting
        - Docs / examples
        - Other
    validations:
      required: true
  - type: dropdown
    id: devices
    attributes:
      label: Which device(s) does this apply to?
      options:
        - All tinySA models
        - tinySA (Basic, ZS304)
        - tinySA Ultra (ZS405)
        - tinySA Ultra+ (ZS406 / ZS407)
        - Not sure
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, or why the raw `command()` passthrough doesn't cover it.
    validations:
      required: false
