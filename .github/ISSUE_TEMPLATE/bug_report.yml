name: Bug report
description: Something isn't working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This library talks to real hardware over serial,
        so please include device and firmware details — many issues are
        firmware- or environment-specific.

        **Two things that answer most reports before anyone asks:**

        1. A log file. Turn it on before reproducing, then attach it:
           ```python
           tsa = tinySA()
           tsa.set_log_file("issue.jsonl")      # UTC-stamped JSON Lines; no screen or scan data at the default level
           tsa.autoconnect()
           ... your code ...
           ```
           Its first line records your board, firmware build and library version;
           each command line records what was sent, what the device answered,
           and why the library returned an error (`"reason"`).
        2. The README section **Firmware Compatibility**. If the device replied
           with a `usage:` line, `name?`, or `Command timeout`, the firmware on the
           device may not have (or may have changed) that command. The library
           supports firmware v1.4-182 and later; `version()` shows yours.

        For questions about **device behavior** (not this library), the
        [official tinySA wiki](https://tinysa.org/wiki/) and the tinySA
        community at groups.io are the right places — they do not support this
        library, and library issues belong here, not there.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact minimal code. Include the command string the library sent if you have it (the log file or set_verbose(True) output shows it).
      render: python
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log file / traceback
      description: Attach `issue.jsonl` (drag it into this box) or paste the relevant lines, plus the full traceback if there was one. `set_error_byte_return(True)` makes refused commands return `ERROR` instead of an empty reply.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: Device model
      description: The board is in `info()` and in the log's first line (ZS304 = Basic, ZS405 = Ultra, ZS406 / ZS407 = Ultra+).
      options:
        - tinySA (Basic, ZS304)
        - tinySA Ultra (ZS405)
        - tinySA Ultra+ (ZS406 / ZS407)
        - "No device connected (reproduces without hardware)"
        - Other / not sure
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware build
      description: Output of `tsa.version()`, or `version_reply` from the log's first line.
      placeholder: "e.g. tinySA4_v1.4-252-g2b4aa51"
    validations:
      required: false
  - type: dropdown
    id: mode
    attributes:
      label: Device mode when it happened
      description: Several commands behave differently while the device is in output (signal generator) mode.
      options:
        - Input mode (spectrum analyzer, the default)
        - Output mode (signal generator)
        - Switching between the two
        - Not sure / not applicable
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11 23H2 / Ubuntu 24.04 / macOS 14"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "output of: python --version"
    validations:
      required: true
  - type: input
    id: tsapython
    attributes:
      label: tsapython version
      placeholder: "output of: python -c \"import tsapython; print(tsapython.__version__)\" (or 'local build from <commit>')"
    validations:
      required: true
  - type: checkboxes
    id: other-software
    attributes:
      label: Anything else holding the serial port?
      description: The tinySA has one serial port and one program can own it at a time. `autoconnect()` reports no device when another program has the port open.
      options:
        - label: The tinySA web UI, tinySA-App, a terminal program or another script was open at the same time
        - label: Nothing else was connected to the device
