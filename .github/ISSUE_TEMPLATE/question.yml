name: Question / usage help
description: How do I use this library to do something?
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For questions about **this library** (tsapython). Questions about the
        tinySA device itself are better answered by the
        [official wiki](https://tinysa.org/wiki/) and the
        [tinySA community](https://groups.io/g/tinysa) — they know the hardware
        far better, but do not support this library.

        Two things worth checking first: the README's command reference (every
        wrapped command, with the firmware build it needs where that matters),
        and the [tinySA web UI](https://lc-linkous.github.io/tinysa-web/) if you
        want to try a command by hand before scripting it.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: The goal, plus what you've tried so far (code welcome).
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      placeholder: "e.g. tinySA Ultra (ZS405), firmware v1.4-252, Windows 11, Python 3.12, tsapython 4.0.0"
    validations:
      required: false
