name: Build release assets

# Builds the wheel and sdist for a tag and attaches them to that tag's GitHub
# release, so the files on the release page are the same ones PyPI gets.
#
# Two ways to run it:
#   1. Push a tag `vX.Y.Z`. A DRAFT release is created for the tag with the
#      built files attached. Edit the notes on the release page, then publish.
#      Publishing fires release.yml, which uploads THESE files to PyPI.
#   2. Actions tab -> "Build release assets" -> Run workflow, and type the tag.
#      Use this to (re)attach files to a release that already exists.
#
# Checks before anything is uploaded: the version in pyproject.toml must equal
# the tag (minus its leading 'v'), and the hardware-free suite, ruff and mypy
# must pass on the tagged commit.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v3.1.0 (must already exist)"
        required: true
        type: string

permissions:
  contents: read            # only the 'attach' job below gets write

defaults:
  run:
    working-directory: tsapython

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      - name: Check the tag matches pyproject.toml
        run: |
          expected="${TAG#v}"
          actual="$(python3 -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$TAG pyproject=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::pyproject.toml says $actual but the tag is $TAG. Bump the version (and CITATION.cff, zenodo.json) and re-tag."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync environment
        run: uv sync --locked

      - name: Test suite, lint, type check
        run: |
          uv run pytest -m "not hardware" --cov=tsapython --cov-fail-under=85
          uv run ruff check .
          uv run mypy

      - name: Build sdist + wheel
        run: |
          rm -rf dist
          uv build
          ls -l dist

      - name: Install the wheel into a clean environment and import it
        run: |
          uv venv /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck/bin/python dist/*.whl
          /tmp/wheelcheck/bin/python -c "import tsapython; print('tsapython', tsapython.__version__)"

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Store build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ env.TAG }}
          path: tsapython/dist/

  attach:
    # Separate job so the write token is never in scope while tests and
    # third-party actions run above.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write         # create the draft release and upload its assets
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Fetch the built files
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ env.TAG }}
          path: dist/

      - name: Create the draft release if the tag has none
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists; attaching files to it"
          else
            notes="Draft created by the build-release workflow. Paste the release notes here, then publish; publishing runs release.yml, which uploads these files to PyPI."
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "$notes"
          fi

      - name: Attach files to the release
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
