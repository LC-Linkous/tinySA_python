name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a dependency or interpreter change that breaks the suite is
    # noticed between releases rather than at the next one.
    - cron: "41 6 * * 1"

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The installable project lives in the tsapython/ subdirectory (the one with
    # pyproject.toml, the pytest config, and the `hardware` marker).
    working-directory: tsapython

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The library is pyserial-based and developed on Windows, lightly
        # tested on Linux -- so both matter; macOS is cheap to include.
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync environment (deps + dev group, editable install)
        run: uv sync

      - name: Run test suite (hardware tests deselected)
        run: uv run pytest -m "not hardware" --cov=tsapython --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Upload coverage to Codecov
        # Optional: only does anything once the repo is linked at
        # https://codecov.io. Tokenless for public repos. Safe to leave in
        # before linking -- it soft-fails.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: tsapython/coverage.xml
          fail_ci_if_error: false

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync environment
        run: uv sync

      - name: Ruff lint
        # Blocking ruleset is E9 + F only (see [tool.ruff.lint] in
        # pyproject.toml); style rules are a planned follow-up cleanup.
        run: uv run ruff check .

      - name: Mypy
        # Blocking. The package ships a py.typed marker, which promises
        # downstream type-checkers that these annotations are real; this gate
        # is what keeps that promise true.
        run: uv run mypy

  build:
    name: package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        # Catches packaging breakage on every push instead of at release time.
        # release.yml does the same build when publishing.
        run: uv build

      - name: Install the wheel into a clean environment and import it
        # A file missing from the wheel (a new module not picked up, a renamed
        # package) passes the editable-install test suite and only fails for a
        # user who pip-installs. This catches it on every push.
        run: |
          uv venv /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck/bin/python dist/*.whl
          /tmp/wheelcheck/bin/python -c "import tsapython; from tsapython import tinySA; from tsapython._profiles import BASIC; print('tsapython', tsapython.__version__)"

  metadata:
    name: version metadata agrees
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: pyproject.toml, CITATION.cff and zenodo.json carry the same version
        # build-release.yml checks the tag against pyproject.toml at release
        # time; this catches a half-done bump on the PR instead.
        run: |
          py="$(python3 -c 'import tomllib; print(tomllib.load(open("tsapython/pyproject.toml","rb"))["project"]["version"])')"
          cff="$(sed -n 's/^version: *"\(.*\)"/\1/p' CITATION.cff)"
          zen="$(python3 -c 'import json; print(json.load(open("zenodo.json"))["version"])')"
          echo "pyproject=$py CITATION.cff=$cff zenodo.json=$zen"
          [ "$py" = "$cff" ] && [ "$py" = "$zen" ] || { echo "::error::version mismatch"; exit 1; }

      - name: CHANGELOG has a section for this version
        run: |
          py="$(python3 -c 'import tomllib; print(tomllib.load(open("tsapython/pyproject.toml","rb"))["project"]["version"])')"
          grep -q "^## \[$py\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$py]' section"; exit 1; }
