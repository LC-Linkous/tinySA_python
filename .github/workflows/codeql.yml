name: CodeQL

# Static analysis for the Python source. Runs on pushes and PRs to main and
# once a week, so a new query that matches old code is still reported.
on:
  push:
    branches: [main, "v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
